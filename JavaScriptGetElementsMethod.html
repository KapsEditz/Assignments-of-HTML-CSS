<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Title</title>
</head>

<body class="container bg-info mt-5 mb-5">
    <u>
        <h2>This is by getElementsByTagName in Script - </h2><br>
    </u>
    <h3>1</h3>
    <h3>2</h3>
    <h3>3</h3>

    <br>
    <hr>
    <br>

    <u>
        <h2>This is by getElementById in Script - </h2><br>
    </u>
    <p>one</p>
    <p id="two">two</p>
    <p>three</p>

    <br>
    <hr>
    <br>

    <u>
        <h2>This is by getElementsByClassName in Script - </h2><br>
    </u>
    <span class="q">one</span><br>
    <span class="q">two</span><br>
    <span class="q">three</span><br><br>

    <br>
    <hr>
    <br>

    <u>
        <h2>This is by getElementsByName in Script - </h2><br>
    </u>
    <h4 name="rad"> One </h4>
    <h4 name="rad"> Two </h4>
    <h4 name="rad"> Three </h4>

    <script>

        document.getElementsByTagName("h3")[2].innerText = "This is Third h3 tag"
        document.getElementById("two").innerText = "This is Second P Tag"
        document.getElementsByClassName("q")[2].innerText = "This is Third span tag"
        document.getElementsByName("rad")[0].innerText = "This is the First name attribute"

    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
