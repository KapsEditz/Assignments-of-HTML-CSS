<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 14</title>
    <style>
        body{
            background-image: url("https://images.unsplash.com/photo-1485470733090-0aae1788d5af?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fGRhcmslMjBtb3VudGFpbnxlbnwwfHwwfHx8MA%3D%3D");
            background-size: cover;
            color: white;
            margin: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }   
        nav{
            background-size: cover;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
        }
        h3{
            margin-left: 20px;
            padding: 10px;
        }
        ul{
            display: flex;
            justify-content: right;
            list-style: none;
            align-self: center;
            gap: 10px;
        }
        li{
            padding: 10px;
            cursor: pointer;
        }
        main{
            text-align: center;
            margin-top: 180px;
        }
        h1{
            font-size: 40px;
        }
        button{
            background-color: tomato;
            border-radius: 5px;
            color: white;
            padding: 15px 30px 15px 30px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover{
            background-color: red;
        }
        li:hover{
            background-color: rgba(128, 128, 128, 0.4);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h3>Logo</h3>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Welcome to our website</h1>
        <p>Discover amazing experience and create lasting memories</p>
        <button type="button">Get Started</button>
    </main>
</body>
</html>
