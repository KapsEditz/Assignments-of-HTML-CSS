<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 10</title>
    <style>
        body{
            background-color: darkturquoise;
        }
        fieldset{
            margin: 25px;
            padding: 20px;
            border-radius: 15px;
        }
        td{
            padding: 10px;
        }
        input{
            border-radius: 5px;
            border: none;
        }
        select{
            border-radius: 5px;
            border: none;
        }
    </style>
    <link rel="icon" href="../pfp.jpg">
</head>
<body>
    <fieldset>
        <legend>Registration Details</legend>
        <table style="display: flex; justify-content: center;">
            <tr>
                <td style="text-align: right;">University : </td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td style="text-align: right;">Institute : </td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td style="text-align: right;">Branch : </td>
                <td>
                    <select style="width: 100px;">
                        <option>--select--</option>
                        <option>Information Technology</option>
                        <option>Computer Engineering</option>
                        <option>Electrical Engineering</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="text-align: right;">Degree : </td>
                <td>
                    <select style="width: 80px;">
                        <option>--select--</option>
                        <option>Information Technology</option>
                        <option>Computer Engineering</option>
                        <option>Electrical Engineering</option>
                    </select>
                    <input type="radio" name="option" style="margin-left: 10px;"><span>Pursing</span>
                    <input type="radio" name="option"><span>Completed</span>
                </td>
            </tr>
            <tr>
                <td style="text-align: right;">Average CPI : </td>
                <td>
                    <input type="number" style="width: 30px;"><span> Upto</span>
                    <input type="number" style="width: 30px;"><span> Th Semester</span>
                </td>
            </tr>
            <tr>
                <td style="text-align: right;">Experience : </td>
                <td>
                    <input type="number" style="width: 40px;"><span> Years</span>
                </td>
            </tr>
            <tr>
                <td style="text-align: right;">Your Website Or Blog : </td>
                <td>
                    <input type="text" placeholder="http://">
                </td>
            </tr>
        </table>
    </fieldset>
</body>
</html>
