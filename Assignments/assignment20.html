<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Assignment 20</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>

<body class="container d-flex flex-column bg-warning">
    <h3 class="text-center mt-4">Value of a = 10 & b = 5</h3>
    <button onclick="add()" class="btn btn-outline-danger p-3 mt-4">Addition</button>
    <button onclick="sub()" class="btn btn-outline-danger p-3 mt-4">Subtraction</button>
    <button onclick="mul()" class="btn btn-outline-danger p-3 mt-4">Multiplication</button>
    <button onclick="div()" class="btn btn-outline-danger p-3 mt-4">Division</button>

    <script>
        function add() {
            let a = 10, b = 5;
            alert("Addition = " + (a + b));
        }

        function sub() {
            let a = 10, b = 5;
            alert("Subtraction = " + (a - b));
        }

        function mul() {
            let a = 10, b = 5;
            alert("Multiplication = " + (a * b));
        }

        function div() {
            let a = 10, b = 5;
            alert("Division = " + (a / b));
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
