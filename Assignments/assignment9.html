    <fieldset>
    <legend>Login Details</legend>
        <table>
            <tr>
                <td>Username: </td>
                <td><input type="text"></td>
            </tr>
            <tr>

    </fieldset>


    <fieldset>
        <legend>Personal Details</legend>
        <table>
            <tr>
                <td>Name: </td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Mother's Name: </td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Father's Name: </td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Date of Birth: </td>

            </tr>
            <tr>
                <td>Gender </td>   
                <td><input type="radio" name="Gender">Male <input type="radio" name="Gender"> Female</td>
            </tr>
        </table>
    </fieldset>
    
    <fieldset>
        <legend>Contact Details</legend>
        <table>
            <tr>
                <td>Contact Number: </td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td>Email ID: </td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>Address: </td>

            </tr>

                        <option>India</option>

                        <option>Nepal</option>

                    <td><input type="text"></td>
                </tr>
                <tr>

                    <td><input type="text"></td>
