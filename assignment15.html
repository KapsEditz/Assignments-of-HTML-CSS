<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edumark Landing Page</title>
    <style>
        body{
            margin: 0;
            background-image: url("https://videocdn.cdnpk.net/videos/34f9193e-c396-47ca-9f22-126a318cae5f/horizontal/thumbnails/large.jpg");
            background-size: cover;
            color: white;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        nav{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.3);
            font-size: larger;
            padding: 10px;
        }
        .ul{
            list-style: none;
            display: flex;
            padding: 0px 20px;
        }
        li{
            padding: 0px 20px;
        }
        #person{
            margin: 0px 5px 0px 20px;
        }
        #book{
            margin-right: 20px;
        }
        #nobutton{
            background-color: tomato;
            padding:  15px 20px;
            border-radius: 50px;
            border: none;
            color: white;
            margin: 0px 5px 0px 20px;
        }
        a{
            color: white;
            text-decoration: none;
        }
        div{
            margin-top: 10%;
            margin-left: 20%;
        }
        h1{
            font-size: 40px;
        }
        #browse{
            background-color: lightseagreen;
            border-radius: 30px;
            border: none;
            padding: 12px 25px;
            color: white;
            width: 220px;
        }

        #page{
            position: relative;
        }
        .dropdown1{
            background-color: rgb(191, 131, 131);
            display: none;
            position: absolute;
            list-style: none;
            margin-top: 130px;
            align-self: center;
        }
        #page:hover ul{
            display: block;
        }

        #blog{
            position: relative;
        }
        .dropdown2{
            background-color: rgb(191, 131, 131);
            display: none;
            position: absolute;
            list-style: none;
            margin-top: 130px;
            align-self: center;
        }
        #blog:hover ul{
            display: block;
        }
    </style>

    <script src="https://kit.fontawesome.com/5483f706e7.js" crossorigin="anonymous"></script>

</head>
<body>
    <header>
        <nav>
            <a href="" id="book"> <i class="fa-solid fa-book-open"></i> Edumark</a>
            <ul class="ul">
                <li>Home</li>
                <li>Courses</li>
                <li id="page">
                    Pages <i class="fa-solid fa-angle-down"></i>
                    <ul class="dropdown1">
                        <li>HTML</li>
                        <li>JAVA</li>
                        <li>CSS</li>
                        <li>BOOTSTRAP</li>
                    </ul>
                </li>
                <li>About</li>
                <li id="blog">
                    Blog <i class="fa-solid fa-angle-down"></i>
                    <ul class="dropdown2">
                        <li>Text</li>
                        <li>Video</li>
                        <li>Image</li>
                        <li>Novel</li>
                    </ul>
                </li>
                <li>Contact</li>
            </ul>
            <a href="" id="person"> <i class="fa-solid fa-user" ></i> Log In</a>
            <button id="nobutton"> <a href="" id="phone"> <i class="fa-solid fa-phone" ></i> +10 578 467 3672</a></button>
        </nav>
    </header>
    <div>
        <h1>Learn Your<br>
            Favorite Course<br>
            From Online
        </h1>

        <button id="browse">Browse Our Courses</button>
    </div>
</body>
</html>
