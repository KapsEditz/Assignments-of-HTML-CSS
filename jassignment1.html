<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"

</head>

<body>
    <label>Grade - </label>
    <input type="text" id="grade" placeholder="Enter your grade ( A - F )- "><br>
    <button type="button" onclick="submitT()" class="btn btn-success p-2 mt-4">Submit</button>


    <script>
        function submitT() {

            let employeeName = "rahul";
            let grade = document.getElementById("grade").value;
            let salary = 25000;

            switch (grade) {
                case "A":
                    salary = salary + 5000;
                    alert("Salary is " + salary)
                    break;
                case "B":
                    salary = salary + 2000;
                    alert("Salary is " + salary)
                    break;
                case "C":
                    salary = salary + 1000;
                    alert("Salary is " + salary)
                    break;
                case "D":
                    alert("Salary is " + salary)
                    break;
                case "E":
                    salary = salary - 3000;
                    alert("Salary is " + salary)
                    break;
                case "F":
                    salary = salary - 10000;
                    alert("Salary is " + salary + ". You should work on your grades bruh!")
                    break;
                default:
                    alert("WRONG INPUT!")
                    break;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
