<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 5</title>
    <style>
        table, tr,td{
            background: pink;
            border: 2px solid black;
            width: 50%;
            margin: auto;
            margin-top: 100px;
            border-collapse: collapse;
        }
        textarea{
            width: 95%;
            height: 60px;
            overflow-y: scroll;
        }
    </style>
</head>
<body >
    <table>
        <tr>
            <td>Name</td>
            <td><input type="text" size="15px"></td>
        </tr>
        <tr>
            <td>Employee Code</td>
            <td><input type="text" size="3px"></td>
        </tr>
        <tr>
            <td>Department</td>
            <td>
                <input type="radio" name="option">ADMIN<br>
                <input type="radio" name="option">HR <br>
                <input type="radio" name="option">TECHNICAL<br>
                <input type="radio" name="option">ACCOUNTS<br>
            </td>
        </tr>
        <tr>
            <td>Date of Joining</td>
            <td>
                <input type="text" size="1px">/
                <input type="text" size="1px">/
                <input type="text" size="4px">
                <pre>dd     mm      yyyy</pre>
            </td>
        </tr>
        <tr>
            <td>Address</td>
            <td>
                <textarea></textarea>
            </td>
        </tr>
        <tr>
            <td>Training programs Attended</td>
            <td>
                <input type="checkbox">HTML/DHTML<br>
                <input type="checkbox">JAVA<br>
                <input type="checkbox">CLIENT/SERVER<br>
                <input type="checkbox">.NET<br>
            </td>
        </tr>
        <tr>
            <td>Training programmes need to Attend</td>
            <td>
                <select>
                    <option>JAVASCRIPT</option>
                    <option>JSTRUCTS</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Send the information at</td>
            <td><a href="https://www.youtube.com/">empinfo@patni.com</a></td>
        </tr>
    </table>
</body>
</html>
