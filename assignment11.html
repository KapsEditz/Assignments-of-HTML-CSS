<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 11</title>
    <style>

        form{
            width: 500px;
            height: 550px; 
            margin: auto;
            margin-top: 50px;
            padding: 25px;
            border: 1px solid rgb(206, 206, 206);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0px 0px 20px rgb(206, 206, 206);
            border-radius: 25px;
        }

        input{
            width: 97%;
            border-radius: 5px;
            padding: 5px;
            margin: 7px;
            margin-right: 5px;
            border: 1px solid rgb(206, 206, 206);
        }

        select{
            width: 100%;
            margin: 7px;
            border-radius: 5px;
            padding: 5px;
            border: 1px solid rgb(206, 206, 206);
        }

        button{
            width: 100%;
            margin: 7px;
            margin-top: 10px;
            border-radius: 5px;
            padding: 7px;
            border: 1px solid rgb(206, 206, 206);
            background-color: limegreen;
        }

        label{
            margin: 7px;
        }

    </style>
    <link rel="icon" href="../pfp.jpg"> 
</head>
<body>
    <form>

        <h2 style="color: limegreen; margin-left: 7px;">Registration Form</h2>
        
        <label for="fn">First Name: </label><br>
        <input type="text" name="Fname" id="fn"><br>
        
        <label for="ln">Last Name: </label><br>
        <input type="text" name="Lname" id="ln"><br>
        
        <label for="email">Email: </label><br>
        <input type="email" name="email" id="email"><br>
        
        <label for="pass">Password: </label><br>
        <input type="password" name="pass" id="pass"><br>
        
        <label for="pass1">Re-Type Password: </label><br>
        <input type="password" name="pass1" id="pass1"><br>
        
        <label for="con">Contact: </label><br>
        <input type="tel" name="con" id="con"><br>
        
        <label for="gender">Gender</label><br>
        <select name="gender" id="gender"><br>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select><br>
        
        <button type="submit">Submit</button><br>

    </form>

</body>
</html>
