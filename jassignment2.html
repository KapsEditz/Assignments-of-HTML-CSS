<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Title</title>
</head>

<body>
    <form class="d-flex flex-column m-5 p-5 bg-warning">
        <label>Name - </label>
        <input type="text" id="name" placeholder="Enter your name">
        <label>Experience - </label>
        <input type="text" id="exp" placeholder="Enter your Experience in Years (1-5)">
        <label>Salary - </label>
        <input type="text" id="sal" placeholder="Enter your salary in Numbers">
        <button type="button" onclick="checkBonus(event)" class="btn btn-success p-2 mt-4">Submit</button>
    </form>

    <script>
        function checkBonus(e) {
            let namee = document.getElementById("name").value;
            let experience = Number(document.getElementById("exp").value);
            let salary = Number(document.getElementById("sal").value);

            if (experience >= 2 && salary >= 50000) {
                salary = salary + 2000;
                alert(namee + " is eligible for Bonus! Salary is " + salary);
            }
            else {
                alert(namee + " isn't eligible for Bonus!");
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
