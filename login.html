<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Login Form</title>
</head>

<body>
    <form class="m-5 bg-warning p-5 d-flex flex-column ">
        <label for="username">Username - </label>
        <input type="text"  id="username" placeholder="Enter your Username" class="p-2"><br>
        <label for="password">Password - </label>
        <input type="text" id="password" placeholder="Enter your Password" class="p-2"><br>
        <button onclick="login()" type="button" class="btn btn-success">Submit</button>
    </form>

    <script>

        let dbname = "Kaps";
        let dbpass = 1234;

        function login() {
            let usernamee = document.getElementById("username").value;
            let passwordd = document.getElementById("password").value;

            if (dbname == usernamee && dbpass == passwordd) 
            {
                alert("Login Successfull!")
            }

            else {
                alert("Login Details NOT Matched!")
            }

        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
