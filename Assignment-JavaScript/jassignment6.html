<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Square of Each Number in an Array</title>
</head>

<body>
    <button type="button" onclick="square()" class="btn btn-outline-success">RUN</button>
    <script>
        function square() {
            alert("Submitted Successfully! Check Console for OUTPUT!");
            let a = [1, 3, 5, 7, 9, 2, 4, 6, 8, 10];
            let square = 0;
            console.log("ARRAY - ")
            for (let i = 0; i < a.length; i++) {
                console.log(a[i]);
            }
            for (let i = 0; i < a.length; i++) {
                square = a[i] * a[i];
                console.log("Square of " + a[i] + " is " + square);
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
