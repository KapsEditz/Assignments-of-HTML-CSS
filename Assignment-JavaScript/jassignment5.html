<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Largest amoung Three Numbers</title>
</head>

<body>

    <form class="d-flex flex-column align-items-center p-5 m-5">
        <input type="number" id="n1" placeholder="Enter First Number"><br><br>
        <input type="number" id="n2" placeholder="Enter Second Number"><br><br>
        <input type="number" id="n3" placeholder="Enter Third Number"><br><br>
        <button type="button" onclick="run()" class="btn btn-outline-success">RUN</button>
    </form>

    <script>

        function run() {
            alert("Submitted Successfully! Check Console for OUTPUT!");

            let num1 = document.getElementById("n1").value;
            let num2 = document.getElementById("n2").value;
            let num3 = document.getElementById("n3").value;

            if (num1 > num2 && num1 > num3) {
                console.log(num1 + " is the Greatest number!");
            }
            else if (num2 > num3) {
                console.log(num2 + " is the Greatest number!");
            }
            else {
                console.log(num3 + " is the Greatest number!");
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
