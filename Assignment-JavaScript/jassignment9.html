<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Advance Form</title>
    <style>
        
        body{
            background-color: pink;
        }

        input {
            padding: 5px;
        }

        form {
            background-color: aqua;
            border-radius: 30px;
            box-shadow: 0px 5px 20px rgb(90, 90, 90);
        }

        #result { 
            background-color: beige;
            border-radius: 30px;
            box-shadow: 0px 5px 20px rgb(90, 90, 90);
            display: flex;
            align-items: center;
            align-self: center;
            align-content: center;
            justify-content: center;
            padding: 10px;
        }

    </style>
</head>

<body>
    <form class="container">
        <div class="container d-flex flex-column p-5 mt-5">
            <h2 style="text-align: center;">Result Calculator</h2>
            <label for="sub1">Algebra - </label><br>
            <input type="number" id="sub1" placeholder="Enter your First Subject Marks"><br>
            <label for="sub2">Geometry - </label><br>
            <input type="number" id="sub2" placeholder="Enter your Second Subject Marks"><br>
            <label for="sub3">Physics - </label><br>
            <input type="number" id="sub3" placeholder="Enter your Third Subject Marks"><br>
            <label for="sub4">Chemistry - </label><br>
            <input type="number" id="sub4" placeholder="Enter your Fourth Subject Marks"><br>
            <label for="sub5">Biology - </label><br>
            <input type="number" id="sub5" placeholder="Enter your Fifth Subject Marks"><br>
            <br><button type="button" class="btn btn-outline-success" onclick="submitbutton()">Submit</button>
        </div>
        
    </form>
    
    <br><br>
    <div id="result" class="container"> 
        <h3 id="h3">OUTPUT WILL BE DISPLAYED HERE</h3>
    </div>
    <br>

    <div>
        <script>
            function submitbutton() {
                let marksarray = [
                    Number(document.getElementById("sub1").value),
                    Number(document.getElementById("sub2").value),
                    Number(document.getElementById("sub3").value),
                    Number(document.getElementById("sub4").value),
                    Number(document.getElementById("sub5").value)
                ]

                let check = 0;

                for (let i = 0; i < marksarray.length; i++) {
                    if (marksarray[i] > 100 || marksarray[i] < 0) {
                        check += 1;
                    }
                }

                if (check == 0) {

                    let total = 0;
                    for (let i = 0; i < marksarray.length; i++) {
                        total += marksarray[i];
                    }
                    let avg = total / 5;
                    let percentage = (total / 500) * 100;
                    let grade = "";

                    if (percentage >= 90) {
                        grade = "A+";
                    }
                    else if (percentage >= 80) {
                        grade = "A";
                    }
                    else if (percentage >= 70) {
                        grade = "B";
                    }
                    else if (percentage >= 60) {
                        grade = "C";
                    }
                    else {
                        grade = "D";
                    }

                    document.getElementById("h3").innerHTML =
                        "Total Marks : " + total + "<br>" +
                        "Average : " + avg + "<br>" +
                        "Percentage : " + percentage + "% <br>" + 
                        "Grade : " + grade;
                }

                else {
                    document.getElementById("h3").innerHTML = "INVALID INPUT";
                }
            }
        </script>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
