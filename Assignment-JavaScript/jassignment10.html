<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Assignment 10</title>
</head>

<body>

    <form>
        <label>Name - </label><br>
        <input type="text" id="name1" placeholder="Enter your name"><br>
        <label>Number - </label><br>
        <input type="tel" id="name2" placeholder="Enter your Number"><br>
        <label>Email - </label><br>
        <input type="email" id="name3" placeholder="Enter your Email"><br>
        <label>Address - </label><br>
        <input type="text" id="name4" placeholder="Enter your Address"><br>
        <button type="button" onclick="run()">Submit</button>

        <button type="button" onclick="runO()">Submit</button>
    </form>

    <script>

        function run() {
            let name = document.getElementById("name1").value;
            let number = document.getElementById("name2").value;
            let email = document.getElementById("name3").value;
            let address = document.getElementById("name4").value;
            console.log("Name - " + name);
            console.log("Number - " + number);
            console.log("Email - " + email);
            console.log("Address - " + address);
        }

        function runO() {
            async function namet() {
                const response = await fetch("https://jsonplaceholder.typicode.com/users");
                const data = await response.json();
                return data;
            }

            namet().then((data) => {
                console.log(data);
            })
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
