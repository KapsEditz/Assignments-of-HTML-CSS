<body>
    <h1 id="demo"></h1>
    <script>

        let str = "BetterCallSaul!"
        let reverse = ""

        for (i = str.length - 1; i >= 0; i--) {
            reverse += str[i];
        }
        console.log("Original String - " + str + "\nReverse String - " + reverse)

        let text = "Apple, Banana, Kiwi";
        let part = text.slice(7, 13);
        document.getElementById("demo").innerHTML = part; 

    </script>
