<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
<link rel="stylesheet" href="styles.css">
<link rel="shortcut icon" href="favicon.png" type="image/png">
<title>Assignment 3</title>
</head>
<body>

    <form class="d-flex flex-column align-self-center m-5">
        <label for="name">Name - </label><br>
        <input type="text" id="name" placeholder="Enter your Name"><br>
        <label for="email">Email - </label><br>
        <input type="email" id="email" placeholder="Enter your Email"><br>
        <label for="number">Number - </label><br>
        <input type="number" id="number" placeholder="Enter your Number"><br><br>
        <button type="button" onclick="submitform()" class="btn btn-outline-success">Submit</button><br><br>

        <label for="search">Search - </label><br>
        <input type="text" id="search" placeholder="Enter whatever you want to search"><br><br>
        <button type="button" onclick="searchform()" class="btn btn-outline-success">Sumbit</button>
    </form>

    <script>

        let namee="";
        let email="";
        let number="";

        function submitform(){
            namee = document.getElementById("name").value;
            email = document.getElementById("email").value;
            number = document.getElementById("number").value;

            console.log("Name:", namee);
            console.log("Email:", email);
            console.log("Number:", number);
            alert("Form Submitted Successfully!");
        }

        function searchform(){
            let search = document.getElementById("search").value;
            let database=["Varad","Kapil","Suhas","Hena"];
            let found = false;
            
            for(let i=0; i<=database.length; i++){
                if(search == database[i]){
                    found = true;
                    break;
                }
            }
            if(found){
                alert("Input Matched!");
            }
            else{
                alert("Input not Found!");
            }
        }

    </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8" crossorigin="anonymous"></script>
<script src="script.js"></script>
</body>
</html>
