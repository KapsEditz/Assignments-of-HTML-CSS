<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Assignment 19</title>
    <style>
        .hlo {
            margin-top: 50px;
        }

        .nav-item {
            padding: 10px;
        }

        #pricing {
            background-color: limegreen;
            border-radius: 20px;
            padding: 10px 30px;
            color: white;
        }

        #register {
            border-radius: 20px;
            box-shadow: 0px 5px 20px cornflowerblue;
            color: white;
            margin: 10px 0px;
        }

        a {
            text-decoration: none;
        }

        input {
            background-color: whitesmoke;
            border: none;
            padding: 10px;
            width: 100%;
            margin: auto;
            margin-top: 10px;
        }

        select {
            background-color: whitesmoke;
            border: none;
            padding: 10px;
            width: 100%;
            margin: 10px 0px;
        }

        form {
            width: 400px;
            padding: 50px 30px;
            box-shadow: 0px 0px 20px rgb(103, 103, 103);
        }

        .left {
            width: 45%;
        }

        .right {
            width: 45%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body class="bg-info text-light">
    <div class="container">
        <nav class="navbar navbar-expand-sm bg-transparent">
            <div class="container">
                <a href="#" class="navbar-brand text-light" style="font-size: x-large;">Landing</a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mynavbar">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a href="#" class="nav-link text-white">Home</a></li>
                        <li class="nav-item"><a href="#" class="nav-link text-white">Features</a></li>
                        <li class="nav-item"><a href="#" class="nav-link text-white">Reviews</a></li>
                        <li class="nav-item"><a href="#" class="nav-link text-white">Pricing</a></li>
                        <li class="nav-item"><a href="#" class="nav-link text-white">FAQ</a></li>
                        <li class="nav-item"><button class="btn btn-outline-light">Get Started</button></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container hlo d-flex align-items-center justify-content-between">
            <div class="left">
                <h1>Fly makes you faster</h1>
                <p>New free template by <a href="#" class="text-secondary">uicookies.com.</a> For more templates visit
                    the <a href="#" class="text-secondary">site.</a> Lorem ipsum dolor sit amet, consectetur adipisicing
                    elit.</p>
                <button class="btn" id="pricing">SEE PRICING</button>
            </div>
            <div class="right">
                <form class="d-flex flex-column bg-white rounded">
                    <h2 class="align-self-center" style="color: rgb(120, 120, 120);">Sign Up for Free</h2>
                    <label for="name"></label>
                    <input type="text" name="name" id="name" placeholder="Full Name">
                    <label for="email"></label>
                    <input type="email" name="email id=" email" placeholder="Email">
                    <label for="pass"></label>
                    <input type="text" name="pass" id="pass" placeholder="Password">
                    <select name="type" id="type">
                        <option>Type</option>
                        <option>Type 1</option>
                        <option>Type 2</option>
                        <option>Type 3</option>
                        <option>Type 4</option>
                    </select>
                    <button type="submit" id="register" class="btn btn-primary">Register</button>
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
