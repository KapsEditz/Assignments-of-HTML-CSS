<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>SwitchCASE</title>
</head>

<body>
    <div class="d-flex flex-column m-5 p-5 bg-warning">
        <input type="text" id="day" placeholder="Enter any number from 1-7" class="p-2">
        <button type="button" onclick="submit()" class="btn btn-success p-2 mt-4">Submit</button>
    </div>

    <script>
        function submit() {

            let day = document.getElementById("day").value;
            switch (day) {
                case "1":
                    alert("Sunday!")
                    break;
                case "2":
                    alert("Monday!")
                    break;
                case "3":
                    alert("Tuesday!")
                    break;
                case "4":
                    alert("Wednesday!")
                    break;
                case "5":
                    alert("Thursday!")
                    break;
                case "6":
                    alert("Friday!")
                    break;
                case "7":
                    alert("Saturday!")
                default:
                    alert("WRONG INPUT!")
            }
        }

    </script>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
